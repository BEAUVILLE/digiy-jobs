<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DIGIY JOBS · Accès DIGIY</title>
<script>window.DIGIY_SUPABASE_URL="https://wesqmwjjtsefyjnluosj.supabase.co";window.DIGIY_SUPABASE_ANON_KEY="sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
:root{--g:#073f32;--gold:#d8ad46;--bg:#f6f1e5;--ink:#173b31;--line:#dfe8e2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);padding:18px}
.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 50px rgba(7,63,50,.12)}
h1{margin:0 0 8px}.hint{color:#65776f;line-height:1.5}label{display:block;font-weight:900;margin:18px 0 6px}input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.btn{width:100%;min-height:52px;border:0;border-radius:999px;background:var(--g);color:#fff;font-weight:950;margin-top:14px;cursor:pointer}.msg{margin-top:12px;font-weight:850}.back{display:inline-block;margin-bottom:14px;color:var(--g);font-weight:900;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<a class="back" href="./">← DIGIY JOBS</a>
<h1>🔐 Accès DIGIY JOBS</h1>
<p class="hint">Accès interne DIGIY uniquement. Les recruteurs n’ont pas de cockpit.</p>
<label for="email">Email DIGIY</label>
<input id="email" type="email" autocomplete="email" placeholder="votre@email.com">
<button class="btn" id="sendBtn" type="button">Recevoir mon magic-link</button>
<div class="msg" id="msg"></div>
</div>
<script>
(function(){
"use strict";
const sb=window.supabase.createClient(window.DIGIY_SUPABASE_URL,window.DIGIY_SUPABASE_ANON_KEY);
const msg=document.getElementById("msg"),email=document.getElementById("email"),btn=document.getElementById("sendBtn");
async function go(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return false;
 const {data,error}=await sb.rpc("digiy_jobs_admin_access_v1");
 if(error||data!==true){msg.textContent="Accès JOBS non autorisé.";await sb.auth.signOut();return false}
 location.replace("./gestion-jobs.html");return true;
}
btn.onclick=async()=>{
 const value=email.value.trim();if(!value){msg.textContent="Saisis ton email.";return}
 btn.disabled=true;msg.textContent="Envoi du lien…";
 const redirect=new URL("./acces-digiy.html",location.href).href;
 const {error}=await sb.auth.signInWithOtp({email:value,options:{emailRedirectTo:redirect}});
 msg.textContent=error?"⚠️ "+error.message:"✅ Magic-link envoyé.";
 btn.disabled=false;
};
sb.auth.onAuthStateChange(()=>go());go();
})();
</script>
</body></html>
