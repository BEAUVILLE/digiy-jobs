<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DIGIY JOBS · Gestion DIGIY</title>
<script>window.DIGIY_SUPABASE_URL="https://wesqmwjjtsefyjnluosj.supabase.co";window.DIGIY_SUPABASE_ANON_KEY="sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<style>
:root{--g:#073f32;--gold:#d8ad46;--bg:#f6f1e5;--ink:#173b31;--line:#dfe8e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}.wrap{width:min(980px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:11px 15px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.meta{color:#6c7d75;font-size:14px}.need{white-space:pre-wrap;line-height:1.5}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff5cf;border:1px solid #ead28a;font-size:12px;font-weight:900}.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.review-actions button{border:0;border-radius:999px;padding:9px 13px;font-weight:900;cursor:pointer}.approve{background:#0f6b4f;color:#fff}.reject{background:#7d2f2f;color:#fff}.reset{background:#ece7d8;color:#173b31}h1{margin:8px 0}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div>💼 DIGIY JOBS</div><h1>Gestion DIGIY</h1></div><button class="btn" id="logout">Déconnexion</button></div>
<p class="meta">Demandes recruteurs reçues avant contrôle et publication.</p>
<div id="status" class="card">Chargement…</div>
<div id="list"></div>
</div>
<script>
(function(){
"use strict";
const sb=window.supabase.createClient(window.DIGIY_SUPABASE_URL,window.DIGIY_SUPABASE_ANON_KEY);
const status=document.getElementById("status"),list=document.getElementById("list");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){location.replace("./acces-digiy.html");return}
 const {data:ok,error:ae}=await sb.rpc("digiy_jobs_admin_access_v1");
 if(ae||ok!==true){await sb.auth.signOut();location.replace("./acces-digiy.html");return}
 const {data,error}=await sb.rpc("digiy_jobs_admin_recruiter_requests_v1");
 if(error){status.textContent="⚠️ "+error.message;return}
 status.textContent=(data||[]).length+" demande(s) recruteur";
 list.innerHTML=(data||[]).map(r=>{
  const st=r.status||"pending_review";
  const actions='<div class="review-actions">'+
    '<button class="approve" data-id="'+esc(r.id)+'" data-status="approved">✅ Valider</button>'+
    '<button class="reject" data-id="'+esc(r.id)+'" data-status="rejected">❌ Refuser</button>'+
    (st!=="pending_review"?'<button class="reset" data-id="'+esc(r.id)+'" data-status="pending_review">↩ Remettre en attente</button>':'')+
  '</div>';
  const pubGate=st==="approved"||st==="ready_to_publish"
    ? '<div class="review-actions"><button class="reset" data-subscription-check="'+esc(r.id)+'">🔎 Vérifier adhésion JOBS</button><button class="approve" data-ready="'+esc(r.id)+'" '+(st==="ready_to_publish"?'disabled':'')+'>📋 Prête à publier</button></div><div class="meta" id="sub-'+esc(r.id)+'">Adhésion non vérifiée.</div>'
    : '';
  const publishBox=st==="ready_to_publish"
    ? '<div class="card" style="margin-top:12px;background:#fbfaf4"><strong>Publication de l’offre</strong><div class="meta">Complète uniquement ce qui ne doit pas être inventé.</div><div class="job-field"><label>Intitulé du poste</label><input id="title-'+esc(r.id)+'"></div><div class="job-field"><label>Secteur</label><input id="sector-'+esc(r.id)+'"></div><div class="job-field"><label>Type de contrat</label><input id="contract-'+esc(r.id)+'" placeholder="Mission, CDI, CDD…"></div><div class="job-field"><label>Rémunération</label><input id="pay-'+esc(r.id)+'" placeholder="Ex. 150 000 FCFA / mois"></div><div class="job-field"><label>Exigences / profil recherché</label><textarea id="req-'+esc(r.id)+'"></textarea></div><button class="btn" data-publish="'+esc(r.id)+'">🚀 Publier l’offre</button></div>'
    : '';
  return '<article class="card"><div><strong>'+esc(r.company_name||"Entreprise")+'</strong> · '+esc(r.recruiter_name||"")+'</div><div class="meta">'+esc(r.zone||"")+(r.country_text?' · '+esc(r.country_text):'')+(r.period_text?' · '+esc(r.period_text):'')+'</div><p class="need">'+esc(r.need_description||"")+'</p><div class="meta">☎ '+esc(r.phone||"")+'</div><span class="status">'+esc(st)+'</span>'+actions+pubGate+publishBox+'</article>';
 }).join("")||'<div class="card">Aucune demande reçue.</div>';
 document.querySelectorAll("[data-status]").forEach(btn=>btn.onclick=()=>setRequestStatus(btn.dataset.id,btn.dataset.status));
 document.querySelectorAll("[data-subscription-check]").forEach(btn=>btn.onclick=()=>checkSubscription(btn.dataset.subscriptionCheck,btn));
 document.querySelectorAll("[data-ready]").forEach(btn=>btn.onclick=()=>markReady(btn.dataset.ready));
 document.querySelectorAll("[data-publish]").forEach(btn=>btn.onclick=()=>publishOffer(btn.dataset.publish));
}
async function setRequestStatus(id,next){
 const label={approved:"valider",rejected:"refuser",pending_review:"remettre en attente"}[next]||next;
 if(!confirm("Confirmer : "+label+" cette demande ?")) return;
 const {error}=await sb.rpc("digiy_jobs_admin_set_recruiter_request_status_v1",{p_id:id,p_status:next});
 if(error){alert("⚠️ "+error.message);return}
 await boot();
}
async function checkSubscription(id,btn){
 const box=document.getElementById("sub-"+id);if(box)box.textContent="Vérification…";
 const {data,error}=await sb.rpc("digiy_jobs_admin_request_subscription_v1",{p_id:id});
 if(error){if(box)box.textContent="⚠️ "+error.message;return}
 if(!data?.found){if(box)box.textContent="❌ Aucune adhésion JOBS trouvée pour ce contact.";return}
 const legacy=Number(data.price_monthly||0)!==19900;
 if(box)box.textContent=(data.active?"✅ Adhésion active":"⚠️ Adhésion inactive")+" · "+(data.slug||"")+(legacy?" · historique":"");
}
async function markReady(id){
 if(!confirm("Confirmer le passage en PRÊTE À PUBLIER ?"))return;
 const {error}=await sb.rpc("digiy_jobs_admin_mark_ready_v1",{p_id:id});
 if(error){alert(error.message==="active_jobs_subscription_required"?"⚠️ Adhésion JOBS active requise.":"⚠️ "+error.message);return}
 await boot();
}
async function publishOffer(id){
 const title=document.getElementById("title-"+id).value.trim();
 const sector=document.getElementById("sector-"+id).value.trim();
 const contract=document.getElementById("contract-"+id).value.trim();
 const pay=document.getElementById("pay-"+id).value.trim();
 const requirements=document.getElementById("req-"+id).value.trim();
 if(!title||!sector){alert("Intitulé et secteur sont obligatoires.");return}
 if(!confirm("Publier cette offre JOBS maintenant ?"))return;
 const {data,error}=await sb.rpc("digiy_jobs_admin_publish_request_v1",{p_id:id,p_title:title,p_sector:sector,p_contract_type:contract,p_pay:pay,p_requirements:requirements});
 if(error){alert("⚠️ "+error.message);return}
 alert("✅ Offre publiée.");
 await boot();
}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.replace("./acces-digiy.html")};
boot();
})();
</script>
</body></html>
