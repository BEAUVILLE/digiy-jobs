name: Construire la traduction complète recruteur

on:
  push:
    branches:
      - main
      - agent/recruiter-page-full-i18n
    paths:
      - ".github/workflows/build-recruiter-i18n.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruire le fichier sans compression
        run: |
          cat \
            recruiter-i18n-parts/part-00.b64 \
            recruiter-i18n-parts/part-01.b64 \
            recruiter-i18n-parts/part-02-03.b64 \
            recruiter-i18n-parts/part-04-05.b64 \
            recruiter-i18n-parts/part-06.b64 \
            | tr -d '[:space:]' \
            | base64 --decode > jobs-recruiter-i18n.js

          echo "5f2ec290757b7689ed4e5d904ec60aa02e592ed0edd2d1381f46478006f4e3ed  jobs-recruiter-i18n.js" | sha256sum --check
          node --check jobs-recruiter-i18n.js

      - name: Relier la page recruteur
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('acces-recruteur.html')
          text = page.read_text(encoding='utf-8')
          general = '  <script src="/jobs-pages-i18n.js?v=20260801-jobs7-pages-fix1" defer></script>'
          specific = '  <script src="/jobs-recruiter-i18n.js?v=20260801-recruiter-full1" defer></script>'

          if specific not in text:
              if general not in text:
                  raise SystemExit('Moteur général introuvable')
              text = text.replace(general, specific + '\n' + general)

          page.write_text(text, encoding='utf-8')
          PY

      - name: Publier les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-recruiter-i18n.js acces-recruteur.html
          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi
          git commit -m "JOBS : traduire entièrement la page recruteur"
          git push
