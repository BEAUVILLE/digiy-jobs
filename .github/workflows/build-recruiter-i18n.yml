name: Construire la traduction complète recruteur

on:
  push:
    branches: [agent/recruiter-page-full-i18n]
    paths:
      - ".github/workflows/build-recruiter-i18n.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le dictionnaire complet
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path

          payload = """"""
          Path("jobs-recruiter-i18n.js").write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )

          page = Path("acces-recruteur.html")
          text = page.read_text(encoding="utf-8")
          marker = '  <script src="/jobs-pages-i18n.js?v=20260801-jobs7-pages-fix1" defer></script>'
          specific = '  <script src="/jobs-recruiter-i18n.js?v=20260801-recruiter-full1" defer></script>'

          if specific not in text:
              if marker not in text:
                  raise SystemExit("Moteur général introuvable")
              text = text.replace(marker, specific + "\n" + marker)

          page.write_text(text, encoding="utf-8")
          PY

      - name: Vérifier le JavaScript
        run: node --check jobs-recruiter-i18n.js

      - name: Publier la traduction complète
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-recruiter-i18n.js acces-recruteur.html
          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi
          git commit -m "JOBS : traduire entièrement la page recruteur"
          git push
