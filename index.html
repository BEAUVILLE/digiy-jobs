<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="index,follow">
  <title>DIGIY JOBS · Module multilingue</title>
  <style>html,body{margin:0;min-height:100%;background:#f6eedf;color:#10231b;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{display:grid;place-items:center;text-align:center}.loading{padding:24px;font-weight:900}</style>
</head>
<body>
  <p class="loading">DIGIY JOBS — chargement…</p>
  <script>
  (function(){
    var VERSION='20260730-jobs9';
    var allowed=/^(fr|en|es|de|it|nl|ar)$/;
    var params=new URLSearchParams(location.search);
    var lang=(params.get('lang')||'').toLowerCase();
    try{if(!allowed.test(lang))lang=(localStorage.getItem('digiy-lang')||'').toLowerCase()}catch(e){}
    if(!allowed.test(lang))lang=(navigator.language||'fr').slice(0,2).toLowerCase();
    if(!allowed.test(lang))lang='fr';
    try{localStorage.setItem('digiy-lang',lang)}catch(e){}
    fetch('./app.html?v='+VERSION,{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('load');
      return r.text();
    }).then(function(html){
      var inject='<base href="./">'+
        '<script>try{localStorage.setItem("digiy-lang","'+lang+'") }catch(e){}<\/script>'+ 
        '<script src="./jobs-i18n-data.js?v='+VERSION+'" defer><\/script>'+ 
        '<script src="./jobs-i18n.js?v='+VERSION+'" defer><\/script>';
      html=html.replace(/<head([^>]*)>/i,'<head$1>'+inject);
      document.open();document.write(html);document.close();
    }).catch(function(){
      location.replace('./app.html?lang='+encodeURIComponent(lang)+'&v='+VERSION);
    });
  })();
  </script>
</body>
</html>
